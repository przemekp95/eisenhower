name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sync_pr_mode:
        description: Run only the required sync-PR checks
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  LOCAL_MODEL_REVISION: "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"

jobs:
  resolve-run-mode:
    name: resolve-run-mode
    runs-on: ubuntu-latest
    outputs:
      skip_full_ci: ${{ steps.resolve.outputs.skip_full_ci }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve CI mode
        id: resolve
        shell: bash
        run: |
          skip_full_ci=false
          reason=standard

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "dev" ]]; then
            git fetch --no-tags --depth=1 origin master
            master_sha="$(git rev-parse origin/master)"

            if [[ "${GITHUB_SHA}" == "$master_sha" ]]; then
              skip_full_ci=true
              reason=fast-forward-sync
            fi
          fi

          echo "skip_full_ci=$skip_full_ci" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $reason"

      - name: Summarize mode
        shell: bash
        run: |
          {
            echo "### CI run mode"
            echo
            echo "- reason: ${{ steps.resolve.outputs.reason }}"
            echo "- skip_full_ci: ${{ steps.resolve.outputs.skip_full_ci }}"
          } >> "$GITHUB_STEP_SUMMARY"

  security-lint:
    name: security-lint
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy scan
        id: trivy-scan
        shell: bash
        run: |
          set +e
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -w /workdir \
            -v "$PWD:/workdir" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.63.0 fs \
            --config /workdir/trivy.yaml \
            --ignorefile /workdir/.trivyignore.yaml \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output /workdir/trivy-results.sarif \
            /workdir
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy gate
        if: ${{ steps.trivy-scan.outputs.exit_code != '0' }}
        run: |
          echo "::error::Trivy detected HIGH or CRITICAL findings."
          exit 1

  test-backend-node:
    name: test-backend-node
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        working-directory: backend-node
        run: npm ci

      - name: Audit production dependencies
        working-directory: backend-node
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: backend-node
        run: npm run build

      - name: Test with coverage
        working-directory: backend-node
        env:
          MONGODB_URI: mongodb://localhost:27017/eisenhower-test
        run: npm run test:coverage

      - name: Run executable BDD scenarios
        working-directory: backend-node
        run: npm run test:bdd

      - name: Type-check application and test sources
        run: make typecheck-node

  test-api-client:
    name: test-api-client
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      - name: Install API client dependencies
        working-directory: packages/api-client
        run: npm ci

      - name: Test API client runtime and declarations
        run: make test-api-client

  test-mcp-adapter:
    name: test-mcp-adapter
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pinned uv runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"

      - name: Test MCP adapter with warnings as errors
        run: make test-mcp

  test-frontend:
    name: test-frontend
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test with coverage
        working-directory: web
        run: npm run test:coverage

  test-frontend-e2e:
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' && !inputs.sync_pr_mode }}
    name: test-frontend-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E smoke suite
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/output/playwright/report
            web/output/playwright/test-results
          if-no-files-found: ignore

  test-frontend-integration:
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' && !inputs.sync_pr_mode }}
    name: test-frontend-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend integration suite
        working-directory: web
        run: npm run test:integration

  test-backend-ai:
    name: test-backend-ai
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install governed extraction system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend-ai/requirements.txt', 'backend-ai/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache immutable MiniLM snapshot
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-huggingface-minilm-${{ env.LOCAL_MODEL_REVISION }}

      - name: Prefetch immutable MiniLM snapshot
        working-directory: backend-ai
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer

          SentenceTransformer(
              "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",
              revision=os.environ["LOCAL_MODEL_REVISION"],
          )
          PY
            then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1

      - name: Audit production dependencies
        working-directory: backend-ai
        run: python scripts/production_dependency_audit.py

      - name: Run tests with coverage
        working-directory: backend-ai
        env:
          PYTHONPATH: ${{ github.workspace }}/backend-ai
        run: python -m pytest

      - name: Build immutable MLOps candidate
        working-directory: backend-ai
        env:
          PYTHONPATH: ${{ github.workspace }}/backend-ai
        run: |
          python scripts/run_mlops_candidate.py \
            --registry "${RUNNER_TEMP}/eisenhower-ai-registry" \
            --candidate-id "mlops-${GITHUB_SHA}" \
            --git-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/eisenhower-ai-candidates/mlops-manifest.json"

      - name: Build immutable non-live LLMOps candidate
        working-directory: backend-ai
        env:
          PYTHONPATH: ${{ github.workspace }}/backend-ai
        run: |
          python scripts/run_llmops_candidate.py \
            --registry "${RUNNER_TEMP}/eisenhower-ai-registry" \
            --candidate-id "llmops-${GITHUB_SHA}" \
            --git-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/eisenhower-ai-candidates/llmops-manifest.json"

      - name: Build immutable live-dependency RAGOps candidate
        if: ${{ vars.ENABLE_RAGOPS_CANDIDATE == 'true' }}
        working-directory: backend-ai
        env:
          PYTHONPATH: ${{ github.workspace }}/backend-ai
        run: |
          python scripts/run_ragops_candidate.py \
            --registry "${RUNNER_TEMP}/eisenhower-ai-registry" \
            --candidate-id "ragops-${GITHUB_SHA}" \
            --git-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/eisenhower-ai-candidates/ragops-manifest.json"

      - name: Upload non-sensitive AI candidate commitments
        uses: actions/upload-artifact@v7
        with:
          name: ai-candidate-commitments-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eisenhower-ai-candidates/mlops-commitment.json
            ${{ runner.temp }}/eisenhower-ai-candidates/llmops-commitment.json
            ${{ runner.temp }}/eisenhower-ai-candidates/ragops-commitment.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce clean Python lint gate
        run: make lint-ai BACKEND_AI_PYTHON=python

  test-mobile:
    name: test-mobile
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/eisenhower-matrix/package-lock.json

      - name: Install dependencies
        working-directory: mobile/eisenhower-matrix
        run: npm ci

      - name: Enforce mobile production audit policy
        working-directory: mobile/eisenhower-matrix
        run: npm run audit:production

      - name: Test with coverage
        working-directory: mobile/eisenhower-matrix
        run: npm run test:coverage

  test-mobile-native-android:
    needs: resolve-run-mode
    if: ${{ needs.resolve-run-mode.outputs.skip_full_ci != 'true' && !inputs.sync_pr_mode }}
    name: test-mobile-native-android
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ORIGIN_URL: ${{ vars.EXPO_PUBLIC_APP_ORIGIN_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AI_API_URL: ${{ vars.EXPO_PUBLIC_AI_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/eisenhower-matrix/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: mobile/eisenhower-matrix
        run: npm ci

      - name: Validate mobile public endpoints
        shell: bash
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          is_public_http_url() {
            local value
            value="$(trim "$1")"
            [[ "$value" =~ ^https?:// ]] || return 1
            [[ "$value" == *,* ]] && return 1
            [[ "$value" =~ ^https?://(localhost|127\.0\.0\.1|10\.0\.2\.2|\[::1\])([/:]|$) ]] && return 1
            return 0
          }

          api_url="$(trim "${EXPO_PUBLIC_API_URL:-}")"
          ai_url="$(trim "${EXPO_PUBLIC_AI_API_URL:-}")"
          app_origin="$(trim "${EXPO_PUBLIC_APP_ORIGIN_URL:-}")"

          if ! is_public_http_url "$api_url"; then
            echo "::error::EXPO_PUBLIC_API_URL repository variable is required and must be a public http(s) URL."
            exit 1
          fi

          if ! is_public_http_url "$ai_url"; then
            echo "::error::EXPO_PUBLIC_AI_API_URL repository variable is required and must be a public http(s) URL."
            exit 1
          fi

          if [[ -n "$app_origin" ]]; then
            if ! is_public_http_url "$app_origin"; then
              echo "::error::EXPO_PUBLIC_APP_ORIGIN_URL must be a public http(s) URL when provided."
              exit 1
            fi

            app_origin="${app_origin%/}"
          fi

          api_url="${api_url%/}"
          ai_url="${ai_url%/}"

          {
            echo "EXPO_PUBLIC_APP_ORIGIN_URL=$app_origin"
            echo "EXPO_PUBLIC_API_URL=$api_url"
            echo "EXPO_PUBLIC_AI_API_URL=$ai_url"
          } >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile/eisenhower-matrix
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Android native CI candidate APK
        working-directory: mobile/eisenhower-matrix/android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          ./gradlew assembleRelease

      - name: Verify CI candidate APK integrity
        shell: bash
        run: |
          apksigner verify --verbose \
            mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk

      - name: Verify embedded mobile endpoints
        shell: bash
        run: |
          bundle_strings_file="$(mktemp)"
          unzip -p mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | strings > "$bundle_strings_file"

          if grep -Eq 'http://(127\.0\.0\.1|localhost|10\.0\.2\.2)(:[0-9]+)?' "$bundle_strings_file"; then
            echo "::error::Release APK still contains loopback development endpoints."
            exit 1
          fi

          if ! grep -Fq "$EXPO_PUBLIC_API_URL" "$bundle_strings_file"; then
            echo "::error::Release APK does not contain the resolved task API URL."
            exit 1
          fi

          if ! grep -Fq "$EXPO_PUBLIC_AI_API_URL" "$bundle_strings_file"; then
            echo "::error::Release APK does not contain the resolved AI API URL."
            exit 1
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p mobile/eisenhower-matrix/output
          cp \
            mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk \
            "mobile/eisenhower-matrix/output/eisenhower-matrix-android-ci-candidate-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: eisenhower-matrix-android-ci-candidate-${{ github.sha }}
          path: mobile/eisenhower-matrix/output/*.apk
          if-no-files-found: error
          retention-days: 14
