name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Release workflow run containing the immutable manifest
        required: true
        type: string
      release_sha:
        description: Exact released master SHA
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy-release:
    name: deploy-release
    runs-on: [self-hosted, eisenhower-deploy]
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout release-bound generic deployment controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download immutable release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eisenhower-release-${{ inputs.release_sha }}
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Validate release identity and evidence binding
        shell: bash
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c release-manifest.json.sha256)
          test "$(jq -r .release_sha release/release-manifest.json)" = "$RELEASE_SHA_INPUT"
          test "$(jq '.images | length' release/release-manifest.json)" -eq 8
          jq -e 'all(.images[]; .digest | test("@sha256:[0-9a-f]{64}$"))' release/release-manifest.json

      - name: Deploy only manifest-bound digests
        shell: bash
        env:
          DEPLOY_ENV_FILE_CONTENT: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/eisenhower-deploy.env"
          printf '%s' "$DEPLOY_ENV_FILE_CONTENT" > "$env_file"
          test -s "$env_file"
          deploy/generic/deploy.sh release/release-manifest.json "$env_file"
