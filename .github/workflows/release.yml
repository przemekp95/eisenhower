name: Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact green master commit to release
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Verify exact green master release SHA
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: node .github/scripts/release-preflight.mjs --release-sha "$RELEASE_SHA_INPUT"

  docker-build-scan:
    name: docker-build-scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: release-preflight
    env:
      RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      TRIVY_IMAGE: aquasec/trivy:0.71.1@sha256:53570e6911c2361ebe7995228088cf83a6b9b73e7f3cdca44bd8f8f425e80fa7
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-ai-boundary
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-boundary
            target: boundary
            require_torch: false
            require_torchvision: false
          - name: backend-ai-classifier
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-classifier
            target: classifier
            require_torch: true
            require_torchvision: true
          - name: backend-ai-knowledge
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-knowledge
            target: knowledge
            require_torch: true
            require_torchvision: false
          - name: backend-ai-ingest
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-ingest
            target: ingest
            require_torch: true
            require_torchvision: true
          - name: backend-ai-response-rocm
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile.response-rocm
            tag: eisenhower-ai-response-rocm
            target: response
            require_torch: false
            require_torchvision: false
          - name: backend-node
            context: .
            dockerfile: ./backend-node/Dockerfile
            tag: eisenhower-api
            target: production
            require_torch: false
            require_torchvision: false
          - name: mcp
            context: .
            dockerfile: ./mcp/eisenhower_adapter/Dockerfile
            tag: eisenhower-mcp
            target: production
            require_torch: false
            require_torchvision: false
          - name: web
            context: .
            dockerfile: ./web/Dockerfile
            tag: eisenhower-web
            target: production
            require_torch: false
            require_torchvision: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preflight.outputs.release_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Check Docker Hub configuration
        id: docker-hub
        shell: bash
        run: |
          if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Docker Hub credentials are required for an immutable production release."
            exit 1
          fi

      - name: Login to Docker Hub
        if: ${{ steps.docker-hub.outputs.enabled == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ format('{0}/{1}:{2}', env.DOCKER_HUB_USERNAME, matrix.tag, env.RELEASE_SHA) }}
          build-args: |
            RELEASE_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan complete image for vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"
          mkdir -p release-security "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            -v "$PWD/release-security:/evidence" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "/evidence/${{ matrix.name }}-${RELEASE_SHA}.trivy.json" \
            "$image_ref"

      - name: Generate image SBOM
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"
          mkdir -p release-security "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            -v "$PWD/release-security:/evidence" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output "/evidence/${{ matrix.name }}-${RELEASE_SHA}.cdx.json" \
            "$image_ref"

      - name: Verify role-specific SBOM coverage
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          REQUIRE_TORCH: ${{ matrix.require_torch }}
          REQUIRE_TORCHVISION: ${{ matrix.require_torchvision }}
        run: |
          set -euo pipefail
          sbom_path="release-security/${{ matrix.name }}-${RELEASE_SHA}.cdx.json"
          if [ "$REQUIRE_TORCH" = "true" ]; then
            jq -e \
              --arg version "2.13.0+cpu" \
              '([.components[]? | select(.name == "torch" and .version == $version)] | length) == 1' \
              "$sbom_path"
          fi
          if [ "$REQUIRE_TORCHVISION" = "true" ]; then
            jq -e \
              --arg version "0.28.0+cpu" \
              '([.components[]? | select(.name == "torchvision" and .version == $version)] | length) == 1' \
              "$sbom_path"
          fi

      - name: Verify image security evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test -s "release-security/${{ matrix.name }}-${RELEASE_SHA}.trivy.json"
          test -s "release-security/${{ matrix.name }}-${RELEASE_SHA}.cdx.json"

      - name: Save verified immutable image candidate
        if: ${{ success() }}
        shell: bash
        run: |
          image_ref="${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"
          docker save "$image_ref" -o "release-security/${{ matrix.name }}-${RELEASE_SHA}.image.tar"
          sha256sum "release-security/${{ matrix.name }}-${RELEASE_SHA}.image.tar" \
            > "release-security/${{ matrix.name }}-${RELEASE_SHA}.image.tar.sha256"

      - name: Preserve image candidate and security evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-security-${{ matrix.name }}-${{ env.RELEASE_SHA }}
          path: |
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.trivy.json
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.cdx.json
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.image.tar
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.image.tar.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - docker-build-scan
      - release-preflight
    env:
      RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Download every scanned image candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-security-*-${{ env.RELEASE_SHA }}
          path: release-security
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Publish scanned images and bind registry digests
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-security/release-manifest.json"
          jq -n --arg release_sha "$RELEASE_SHA" \
            '{schema_version:"eisenhower-release/v1",release_sha:$release_sha,images:[]}' > "$manifest"
          while IFS='|' read -r name repository; do
            archive="release-security/${name}-${RELEASE_SHA}.image.tar"
            trivy="release-security/${name}-${RELEASE_SHA}.trivy.json"
            sbom="release-security/${name}-${RELEASE_SHA}.cdx.json"
            sha256sum -c "${archive}.sha256"
            test -s "$trivy"
            test -s "$sbom"
            docker load --input "$archive"
            tag="${DOCKER_HUB_USERNAME}/${repository}:${RELEASE_SHA}"
            docker push "$tag"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
            test -n "$digest"
            trivy_sha="$(sha256sum "$trivy" | cut -d' ' -f1)"
            sbom_sha="$(sha256sum "$sbom" | cut -d' ' -f1)"
            jq --arg name "$name" --arg digest "$digest" \
              --arg trivy_sha256 "$trivy_sha" --arg sbom_sha256 "$sbom_sha" \
              '.images += [{name:$name,digest:$digest,trivy_sha256:$trivy_sha256,sbom_sha256:$sbom_sha256}]' \
              "$manifest" > "${manifest}.tmp"
            mv "${manifest}.tmp" "$manifest"
          done <<'IMAGES'
          backend-ai-boundary|eisenhower-ai-boundary
          backend-ai-classifier|eisenhower-ai-classifier
          backend-ai-knowledge|eisenhower-ai-knowledge
          backend-ai-ingest|eisenhower-ai-ingest
          backend-ai-response-rocm|eisenhower-ai-response-rocm
          backend-node|eisenhower-api
          mcp|eisenhower-mcp
          web|eisenhower-web
          IMAGES
          test "$(jq '.images | length' "$manifest")" -eq 8
          (cd release-security && sha256sum release-manifest.json > release-manifest.json.sha256)

      - name: Upload immutable release manifest and security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eisenhower-release-${{ env.RELEASE_SHA }}
          path: |
            release-security/release-manifest.json
            release-security/release-manifest.json.sha256
            release-security/*.trivy.json
            release-security/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  android-release:
    name: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: release-preflight
    env:
      RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
      EXPO_PUBLIC_APP_ORIGIN_URL: ${{ vars.EXPO_PUBLIC_APP_ORIGIN_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AI_API_URL: ${{ vars.EXPO_PUBLIC_AI_API_URL }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preflight.outputs.release_sha }}

      - name: Require production signing configuration
        shell: bash
        run: |
          missing=0
          for key in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required for the production Android release."
              missing=1
            fi
          done

          normalized_digest="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a full SHA-256 certificate digest."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode production keystore
        shell: bash
        run: |
          umask 077
          keystore_path="$RUNNER_TEMP/eisenhower-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/eisenhower-matrix/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/eisenhower-matrix/package-lock.json
            mobile/eisenhower-matrix/android/**/*.gradle*
            mobile/eisenhower-matrix/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Verify production keystore access
        shell: bash
        run: |
          keytool -list \
            -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile/eisenhower-matrix
        run: npm ci

      - name: Validate production mobile endpoints
        shell: bash
        run: |
          for key in EXPO_PUBLIC_API_URL EXPO_PUBLIC_AI_API_URL; do
            value="${!key}"
            if [[ ! "$value" =~ ^https:// ]] || [[ "$value" == *,* ]] || [[ "$value" =~ ^https://(localhost|127\.0\.0\.1|10\.0\.2\.2|\[::1\])([/:]|$) ]]; then
              echo "::error::$key is required and must be one public HTTPS URL."
              exit 1
            fi
          done

      - name: Generate native Android project
        working-directory: mobile/eisenhower-matrix
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure production signing
        working-directory: mobile/eisenhower-matrix
        run: node scripts/androidReleaseSigning.js configure android/app/build.gradle

      - name: Build production Android APK
        working-directory: mobile/eisenhower-matrix/android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          ./gradlew assembleRelease

      - name: Verify embedded production endpoints
        shell: bash
        run: |
          bundle_strings_file="$(mktemp)"
          unzip -p mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | strings > "$bundle_strings_file"

          if grep -Eq 'http://(127\.0\.0\.1|localhost|10\.0\.2\.2)(:[0-9]+)?' "$bundle_strings_file"; then
            echo "::error::Production APK contains loopback development endpoints."
            exit 1
          fi
          grep -Fq "$EXPO_PUBLIC_API_URL" "$bundle_strings_file"
          grep -Fq "$EXPO_PUBLIC_AI_API_URL" "$bundle_strings_file"

      - name: Verify pinned production signature
        working-directory: mobile/eisenhower-matrix
        run: |
          node scripts/androidReleaseSigning.js verify \
            android/app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_RELEASE_CERT_SHA256"

      - name: Prepare immutable Android release artifact
        shell: bash
        run: |
          output_dir="mobile/eisenhower-matrix/output"
          apk_name="eisenhower-matrix-android-release-${RELEASE_SHA}.apk"
          mkdir -p "$output_dir"
          cp mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk "$output_dir/$apk_name"
          sha256sum "$output_dir/$apk_name" > "$output_dir/$apk_name.sha256"
          jq -n \
            --arg commit "$RELEASE_SHA" \
            --arg certificate_sha256 "$ANDROID_RELEASE_CERT_SHA256" \
            --arg apk "$apk_name" \
            '{commit: $commit, certificate_sha256: $certificate_sha256, apk: $apk}' \
            > "$output_dir/$apk_name.json"

      - name: Upload production Android release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eisenhower-matrix-android-release-${{ env.RELEASE_SHA }}
          path: mobile/eisenhower-matrix/output/*
          if-no-files-found: error
          retention-days: 90

  final-release-gate:
    name: final-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - publish-release
      - android-release
      - release-preflight
    env:
      RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
    steps:
      - name: Download container release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eisenhower-release-${{ env.RELEASE_SHA }}
          path: release

      - name: Download signed Android release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eisenhower-matrix-android-release-${{ env.RELEASE_SHA }}
          path: android

      - name: Bind every released artifact to one final gate
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c release-manifest.json.sha256)
          apk="$(find android -maxdepth 1 -name 'eisenhower-matrix-android-release-*.apk' -type f -print -quit)"
          apk_metadata="${apk}.json"
          apk_checksum="${apk}.sha256"
          test -s "$apk" && test -s "$apk_metadata" && test -s "$apk_checksum"
          test "$(sha256sum "$apk" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$apk_checksum")"
          test "$(jq -r .commit "$apk_metadata")" = "$RELEASE_SHA"
          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg container_manifest_sha256 "$(sha256sum release/release-manifest.json | cut -d' ' -f1)" \
            --arg android_apk_sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --arg android_certificate_sha256 "$(jq -r .certificate_sha256 "$apk_metadata")" \
            '{schema_version:"eisenhower-final-release/v1",release_sha:$release_sha,container_manifest_sha256:$container_manifest_sha256,android_apk_sha256:$android_apk_sha256,android_certificate_sha256:$android_certificate_sha256}' \
            > final-release.json
          sha256sum final-release.json > final-release.json.sha256

      - name: Upload auditable final release gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eisenhower-final-release-${{ env.RELEASE_SHA }}
          path: |
            final-release.json
            final-release.json.sha256
          if-no-files-found: error
          retention-days: 90
