name: Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact green master commit to release
        required: true
        type: string
      deploy:
        description: Deploy the released images after publishing them
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  docker-release:
    name: docker-release
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      TRIVY_IMAGE: aquasec/trivy:0.71.1@sha256:53570e6911c2361ebe7995228088cf83a6b9b73e7f3cdca44bd8f8f425e80fa7
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-ai-boundary
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-boundary
            target: boundary
            require_torch: false
            require_torchvision: false
          - name: backend-ai-classifier
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-classifier
            target: classifier
            require_torch: true
            require_torchvision: true
          - name: backend-ai-knowledge
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-knowledge
            target: knowledge
            require_torch: true
            require_torchvision: false
          - name: backend-ai-ingest
            context: ./backend-ai
            dockerfile: ./backend-ai/Dockerfile
            tag: eisenhower-ai-ingest
            target: ingest
            require_torch: true
            require_torchvision: true
          - name: backend-node
            context: .
            dockerfile: ./backend-node/Dockerfile
            tag: eisenhower-api
            target: production
            require_torch: false
            require_torchvision: false
          - name: web
            context: .
            dockerfile: ./web/Dockerfile
            tag: eisenhower-web
            target: production
            require_torch: false
            require_torchvision: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub configuration
        id: docker-hub
        shell: bash
        run: |
          if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Docker Hub credentials are required for an immutable production release."
            exit 1
          fi

      - name: Login to Docker Hub
        if: ${{ steps.docker-hub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ format('{0}/{1}:{2}', env.DOCKER_HUB_USERNAME, matrix.tag, env.RELEASE_SHA) }}
          build-args: |
            RELEASE_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan complete image for vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"
          mkdir -p release-security "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            -v "$PWD/release-security:/evidence" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "/evidence/${{ matrix.name }}-${RELEASE_SHA}.trivy.json" \
            "$image_ref"

      - name: Generate image SBOM
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"
          mkdir -p release-security "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            -v "$PWD/release-security:/evidence" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output "/evidence/${{ matrix.name }}-${RELEASE_SHA}.cdx.json" \
            "$image_ref"

      - name: Verify role-specific SBOM coverage
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          REQUIRE_TORCH: ${{ matrix.require_torch }}
          REQUIRE_TORCHVISION: ${{ matrix.require_torchvision }}
        run: |
          set -euo pipefail
          sbom_path="release-security/${{ matrix.name }}-${RELEASE_SHA}.cdx.json"
          if [ "$REQUIRE_TORCH" = "true" ]; then
            jq -e \
              --arg version "2.13.0+cpu" \
              '([.components[]? | select(.name == "torch" and .version == $version)] | length) == 1' \
              "$sbom_path"
          fi
          if [ "$REQUIRE_TORCHVISION" = "true" ]; then
            jq -e \
              --arg version "0.28.0+cpu" \
              '([.components[]? | select(.name == "torchvision" and .version == $version)] | length) == 1' \
              "$sbom_path"
          fi

      - name: Verify image security evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test -s "release-security/${{ matrix.name }}-${RELEASE_SHA}.trivy.json"
          test -s "release-security/${{ matrix.name }}-${RELEASE_SHA}.cdx.json"

      - name: Preserve image security evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-image-security-${{ matrix.name }}-${{ env.RELEASE_SHA }}
          path: |
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.trivy.json
            release-security/${{ matrix.name }}-${{ env.RELEASE_SHA }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified image
        if: ${{ success() }}
        shell: bash
        run: docker push "${DOCKER_HUB_USERNAME}/${{ matrix.tag }}:${RELEASE_SHA}"

  android-release:
    name: android-release
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ORIGIN_URL: ${{ vars.EXPO_PUBLIC_APP_ORIGIN_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AI_API_URL: ${{ vars.EXPO_PUBLIC_AI_API_URL }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout immutable release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Require production signing configuration
        shell: bash
        run: |
          missing=0
          for key in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required for the production Android release."
              missing=1
            fi
          done

          normalized_digest="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a full SHA-256 certificate digest."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode production keystore
        shell: bash
        run: |
          umask 077
          keystore_path="$RUNNER_TEMP/eisenhower-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/eisenhower-matrix/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/eisenhower-matrix/package-lock.json
            mobile/eisenhower-matrix/android/**/*.gradle*
            mobile/eisenhower-matrix/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Verify production keystore access
        shell: bash
        run: |
          keytool -list \
            -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile/eisenhower-matrix
        run: npm ci

      - name: Validate production mobile endpoints
        shell: bash
        run: |
          for key in EXPO_PUBLIC_API_URL EXPO_PUBLIC_AI_API_URL; do
            value="${!key}"
            if [[ ! "$value" =~ ^https:// ]] || [[ "$value" == *,* ]] || [[ "$value" =~ ^https://(localhost|127\.0\.0\.1|10\.0\.2\.2|\[::1\])([/:]|$) ]]; then
              echo "::error::$key is required and must be one public HTTPS URL."
              exit 1
            fi
          done

      - name: Generate native Android project
        working-directory: mobile/eisenhower-matrix
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure production signing
        working-directory: mobile/eisenhower-matrix
        run: node scripts/androidReleaseSigning.js configure android/app/build.gradle

      - name: Build production Android APK
        working-directory: mobile/eisenhower-matrix/android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          ./gradlew assembleRelease

      - name: Verify embedded production endpoints
        shell: bash
        run: |
          bundle_strings_file="$(mktemp)"
          unzip -p mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | strings > "$bundle_strings_file"

          if grep -Eq 'http://(127\.0\.0\.1|localhost|10\.0\.2\.2)(:[0-9]+)?' "$bundle_strings_file"; then
            echo "::error::Production APK contains loopback development endpoints."
            exit 1
          fi
          grep -Fq "$EXPO_PUBLIC_API_URL" "$bundle_strings_file"
          grep -Fq "$EXPO_PUBLIC_AI_API_URL" "$bundle_strings_file"

      - name: Verify pinned production signature
        working-directory: mobile/eisenhower-matrix
        run: |
          node scripts/androidReleaseSigning.js verify \
            android/app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_RELEASE_CERT_SHA256"

      - name: Prepare immutable Android release artifact
        shell: bash
        run: |
          output_dir="mobile/eisenhower-matrix/output"
          apk_name="eisenhower-matrix-android-release-${RELEASE_SHA}.apk"
          mkdir -p "$output_dir"
          cp mobile/eisenhower-matrix/android/app/build/outputs/apk/release/app-release.apk "$output_dir/$apk_name"
          sha256sum "$output_dir/$apk_name" > "$output_dir/$apk_name.sha256"
          jq -n \
            --arg commit "$RELEASE_SHA" \
            --arg certificate_sha256 "$ANDROID_RELEASE_CERT_SHA256" \
            --arg apk "$apk_name" \
            '{commit: $commit, certificate_sha256: $certificate_sha256, apk: $apk}' \
            > "$output_dir/$apk_name.json"

      - name: Upload production Android release
        uses: actions/upload-artifact@v7
        with:
          name: eisenhower-matrix-android-release-${{ env.RELEASE_SHA }}
          path: mobile/eisenhower-matrix/output/*
          if-no-files-found: error
          retention-days: 90

  deploy-mikrus:
    name: deploy-mikrus
    if: ${{ github.event.inputs.deploy == 'true' }}
    runs-on:
      - self-hosted
      - mikrus
    # Public web/API availability is independent from the separately signed
    # Android artifact. A missing owner keystore must not suppress deployment
    # of otherwise green exact-SHA service images.
    needs: docker-release
    env:
      MIKRUS_HOST: ${{ secrets.MIKRUS_HOST }}
      MIKRUS_USER: ${{ secrets.MIKRUS_USER }}
      MIKRUS_SSH_KEY: ${{ secrets.MIKRUS_SSH_KEY }}
      MIKRUS_ENV_FILE: ${{ secrets.MIKRUS_ENV_FILE }}
      MIKRUS_APP_DIR: ${{ secrets.MIKRUS_APP_DIR }}
      MIKRUS_PUBLIC_URL: ${{ vars.MIKRUS_PUBLIC_URL }}
      IMAGE_TAG: ${{ inputs.release_sha }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Check Mikrus configuration
        shell: bash
        run: |
          missing=0

          for key in MIKRUS_HOST MIKRUS_USER MIKRUS_SSH_KEY MIKRUS_ENV_FILE MIKRUS_APP_DIR MIKRUS_PUBLIC_URL DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "$key is missing."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Mikrus production deployment configuration is incomplete."
            exit 1
          fi

      - name: Deploy to Mikrus
        shell: bash
        run: .github/scripts/deploy-mikrus.sh

  deploy:
    name: deploy
    if: ${{ github.event.inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    needs: docker-release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
    outputs:
      enabled: ${{ steps.aws-config.outputs.enabled }}
    steps:
      - name: Check deployment configuration
        id: aws-config
        shell: bash
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$AWS_REGION" ] && [ -n "$ECS_CLUSTER" ] && [ -n "$ECS_SERVICE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AWS deployment secrets are not configured. Skipping deployment."
          fi

      - name: Configure AWS credentials
        if: ${{ steps.aws-config.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS deployment
        if: ${{ steps.aws-config.outputs.enabled == 'true' }}
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment

  performance-test:
    name: performance-test
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.outputs.enabled == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check k6 script
        id: k6-script
        shell: bash
        run: |
          if [ -f tests/performance/k6-script.js ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tests/performance/k6-script.js is missing. Skipping performance test."
          fi

      - name: Run k6
        if: ${{ steps.k6-script.outputs.exists == 'true' }}
        working-directory: tests/performance
        run: docker run --rm -v "$(pwd):/scripts" -i grafana/k6 run --out json=results.json /scripts/k6-script.js
