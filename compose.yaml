name: eisenhower

x-common: &common
  restart: unless-stopped
  networks:
    - private

services:
  web:
    <<: *common
    image: ${WEB_IMAGE:?WEB_IMAGE must be a versioned tag or digest}
    environment:
      - VITE_API_URL=/api
      - VITE_AI_API_URL=/ai
      - VITE_OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - VITE_OIDC_CLIENT_ID=eisenhower-web
      - VITE_OIDC_REDIRECT_URI=${EISENHOWER_OIDC_REDIRECT_URI:?EISENHOWER_OIDC_REDIRECT_URI is required}
      - VITE_OIDC_SCOPES=openid tasks:read tasks:write calendar:read calendar:write knowledge:read ai:analyze
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  # The Mongo outbox publisher runs inside this real Node process. There is no
  # separate outbox-worker entrypoint to deploy.
  api-service:
    <<: *common
    image: ${API_IMAGE:?API_IMAGE must be a versioned tag or digest}
    depends_on:
      mongodb:
        condition: service_healthy
      audit-volume-init:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${APP_ENV:?APP_ENV is required}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/eisenhower?replicaSet=rs0}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - AUTH_MODE=${AUTH_MODE:?AUTH_MODE is required}
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - CALENDAR_INTERNAL_HMAC_KEY=${CALENDAR_INTERNAL_HMAC_KEY:?CALENDAR_INTERNAL_HMAC_KEY is required}
      - GOOGLE_CALENDAR_OAUTH_CLIENT_ID=${GOOGLE_CALENDAR_OAUTH_CLIENT_ID:?GOOGLE_CALENDAR_OAUTH_CLIENT_ID is required}
      - GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET=${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET:?GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET is required}
      - GOOGLE_CALENDAR_OAUTH_CALLBACK_URL=${GOOGLE_CALENDAR_OAUTH_CALLBACK_URL:?GOOGLE_CALENDAR_OAUTH_CALLBACK_URL is required}
      - GOOGLE_CALENDAR_OAUTH_ENCRYPTION_KEY=${GOOGLE_CALENDAR_OAUTH_ENCRYPTION_KEY:?GOOGLE_CALENDAR_OAUTH_ENCRYPTION_KEY is required}
      - GOOGLE_CALENDAR_OAUTH_RETURN_ORIGIN=${GOOGLE_CALENDAR_OAUTH_RETURN_ORIGIN:-}
      - GOOGLE_CALENDAR_WATCH_CALLBACK_URLS=${GOOGLE_CALENDAR_WATCH_CALLBACK_URLS:?GOOGLE_CALENDAR_WATCH_CALLBACK_URLS is required}
      - AUDIT_LOG_PATH=/app/audit/node-audit.ndjson
      - RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
    volumes:
      - audit_data:/app/audit

  audit-volume-init:
    <<: *common
    image: ${VOLUME_INIT_IMAGE:-alpine:3.20}
    restart: "no"
    command:
      - sh
      - -c
      - >-
        chown 65532:65532 /audit && chmod 0770 /audit &&
        chown 65532:65532 /rag-jobs && chmod 0770 /rag-jobs &&
        chown 65532:65532 /model-cache && chmod 0770 /model-cache &&
        chown 65532:65532 /classifier-runtime && chmod 0770 /classifier-runtime &&
        chown 65532:65532 /knowledge-runtime && chmod 0770 /knowledge-runtime &&
        chown 65532:65532 /ingest-runtime && chmod 0770 /ingest-runtime &&
        find /audit -maxdepth 1 -type f -name 'audit.sqlite3*'
        -exec chown 65532:65532 {} + -exec chmod 0600 {} +
    volumes:
      - audit_data:/audit
      - rag_jobs:/rag-jobs
      - model_cache:/model-cache
      - classifier_runtime:/classifier-runtime
      - knowledge_runtime:/knowledge-runtime
      - ingest_runtime:/ingest-runtime

  backup-volume-helper:
    <<: *common
    image: ${VOLUME_INIT_IMAGE:-alpine:3.20}
    profiles: [maintenance]
    restart: "no"
    command: ["true"]
    volumes:
      - audit_data:/volumes/audit
      - n8n_data:/volumes/n8n
      - grafana_data:/volumes/grafana
      - identity_db_data:/volumes/identity
      - rag_jobs:/volumes/rag-jobs

  mongodb:
    <<: *common
    image: ${MONGODB_IMAGE:-mongo:7.0.24-jammy}
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - ${MONGODB_CACHE_SIZE_GB:-0.25}
    mem_limit: ${MONGODB_MEMORY_LIMIT:-1g}
    cpus: ${MONGODB_CPUS:-1.0}
    pids_limit: 512
    environment:
      - MONGO_INITDB_DATABASE=eisenhower
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (error) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}).ok }'
          | grep 1
      interval: 30s
      timeout: 5s
      retries: 5

  ai-service:
    <<: *common
    image: ${AI_BOUNDARY_IMAGE:?AI_BOUNDARY_IMAGE must be a versioned tag or digest}
    group_add: ["1001"]
    depends_on:
      audit-volume-init:
        condition: service_completed_successfully
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required}
      - AUTH_MODE=${AUTH_MODE:?AUTH_MODE is required}
      - EISENHOWER_API_TOKEN=${EISENHOWER_API_TOKEN:-unused-in-oidc-mode}
      - EISENHOWER_ADMIN_TOKEN=${EISENHOWER_ADMIN_TOKEN:-unused-in-oidc-mode}
      - EISENHOWER_INTERNAL_API_TOKEN=${EISENHOWER_INTERNAL_API_TOKEN:?EISENHOWER_INTERNAL_API_TOKEN is required}
      - INTERNAL_ALLOWED_TENANTS=${INTERNAL_ALLOWED_TENANTS:?INTERNAL_ALLOWED_TENANTS is required}
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - AUDIT_DATABASE_PATH=/app/audit/audit.sqlite3
      - RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
      - CLASSIFIER_SERVICE_URL=http://classifier-service:8000
      - KNOWLEDGE_SERVICE_URL=${KNOWLEDGE_SERVICE_URL:-http://classifier-service:8000}
      - AI_ROLE_ALLOWED_HOSTS=classifier-service,knowledge-service
    volumes:
      - audit_data:/app/audit
    mem_limit: ${AI_BOUNDARY_MEMORY_LIMIT:?calibrated AI boundary memory limit is required}
    cpus: ${AI_BOUNDARY_CPU_LIMIT:?calibrated AI boundary CPU limit is required}
    pids_limit: ${AI_BOUNDARY_PID_LIMIT:?calibrated AI boundary PID limit is required}

  classifier-service:
    <<: *common
    image: ${AI_CLASSIFIER_IMAGE:?AI_CLASSIFIER_IMAGE must be a versioned tag or digest}
    group_add: ["1001"]
    depends_on:
      audit-volume-init:
        condition: service_completed_successfully
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required}
      - AUTH_MODE=${AUTH_MODE:?AUTH_MODE is required}
      - EISENHOWER_INTERNAL_API_TOKEN=${EISENHOWER_INTERNAL_API_TOKEN:?EISENHOWER_INTERNAL_API_TOKEN is required}
      - EISENHOWER_WEBHOOK_SECRET=${EISENHOWER_WEBHOOK_SECRET:?EISENHOWER_WEBHOOK_SECRET is required}
      - INTERNAL_ALLOWED_TENANTS=${INTERNAL_ALLOWED_TENANTS:?INTERNAL_ALLOWED_TENANTS is required}
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - AUDIT_DATABASE_PATH=/app/audit/audit.sqlite3
      - RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - LOCAL_MODEL_REVISION=${LOCAL_MODEL_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
      - LOCAL_MODEL_REQUIRE_EVALUATION=true
      - LOCAL_MODEL_EVALUATION_PROFILE=production
      - LOCAL_MODEL_APPROVED_EVALUATION_SHA256=${LOCAL_MODEL_APPROVED_EVALUATION_SHA256:?approved evaluation digest is required}
      - LOCAL_MODEL_APPROVED_ARTIFACT_SHA256=${LOCAL_MODEL_APPROVED_ARTIFACT_SHA256:?approved classifier pointer digest is required}
      - LOCAL_MODEL_ARTIFACT_DIR=/app/model-artifacts
      - MODEL_CACHE_DIR=/app/runtime
      - LOCAL_MODEL_OWNER_APPROVAL_BYPASS=${LOCAL_MODEL_OWNER_APPROVAL_BYPASS:-false}
      - LOCAL_MODEL_OWNER_APPROVAL_VALID_UNTIL=${LOCAL_MODEL_OWNER_APPROVAL_VALID_UNTIL:-}
      - EVALUATION_DATA_PATH=/app/evaluation/production.json
      - AI_MANAGEMENT_ENABLED=false
      - RAG_ENABLED=false
      - RAG_RETRIEVAL_ENABLED=false
      - RAG_RETRIEVAL_STRATEGY=dense-v1
      - RAG_GENERATION_ENABLED=false
      - RAG_RESPONSE_ENABLED=false
      - RAG_RESPONSE_PROMOTION_POINTER_PATH=/app/promotion/current.json
      - RAG_RESPONSE_CANDIDATE_ID=${RAG_RESPONSE_CANDIDATE_ID:-}
      - RAG_ALLOWED_TENANTS=${RAG_ALLOWED_TENANTS:-}
      - RAG_RESPONSE_ALLOWED_USERS=${RAG_RESPONSE_ALLOWED_USERS:-}
      - MEMORY_WRITE_ENABLED=${MEMORY_WRITE_ENABLED:-false}
      - MEMORY_RETRIEVAL_ENABLED=${MEMORY_RETRIEVAL_ENABLED:-false}
      - MEMORY_RESPONSE_ENABLED=${MEMORY_RESPONSE_ENABLED:-false}
      - MEMORY_POLICY_PATH=/app/policies/memory-policy-v1.json
      - MEMORY_CONSENT_HMAC_KEY=${MEMORY_CONSENT_HMAC_KEY:-}
      - MEMORY_CONSENT_HMAC_KEY_ID=${MEMORY_CONSENT_HMAC_KEY_ID:-runtime}
      - MEMORY_PROJECTION_COLLECTION=${MEMORY_PROJECTION_COLLECTION:-eisenhower-memory-v1}
      - MEMORY_PROJECTION_VERSION=${MEMORY_PROJECTION_VERSION:-memory-projection-v1}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-eisenhower-knowledge-active}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/eisenhower?replicaSet=rs0}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-eisenhower}
      - CANONICAL_DOCUMENTS_COLLECTION=${CANONICAL_DOCUMENTS_COLLECTION:-rag_documents}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-http://reranker:8000}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-}
      - RERANKER_ALLOWED_HOSTS=${RERANKER_ALLOWED_HOSTS:-reranker}
      - INFERENCE_BASE_URL=${INFERENCE_BASE_URL:-http://inference:8000/v1}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
      - INFERENCE_ALLOWED_HOSTS=${INFERENCE_ALLOWED_HOSTS:-inference}
      - JOBS_DATABASE_PATH=/app/data/jobs.sqlite3
      - JOBS_MAX_QUEUED=${JOBS_MAX_QUEUED:?measured bounded queue capacity is required}
      - OMP_NUM_THREADS=${AI_CLASSIFIER_OMP_THREADS:?measured classifier OMP thread limit is required}
      - MKL_NUM_THREADS=${AI_CLASSIFIER_OMP_THREADS:?measured classifier OMP thread limit is required}
      - OPENBLAS_NUM_THREADS=${AI_CLASSIFIER_OMP_THREADS:?measured classifier OMP thread limit is required}
      - NUMEXPR_NUM_THREADS=${AI_CLASSIFIER_OMP_THREADS:?measured classifier OMP thread limit is required}
      - TORCH_NUM_THREADS=${AI_CLASSIFIER_TORCH_THREADS:?measured classifier Torch thread limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - model_cache:/home/app/.cache/huggingface
      - classifier_runtime:/app/runtime
      - rag_jobs:/app/data
      - audit_data:/app/audit
      - ${AI_CLASSIFIER_ARTIFACT_ROOT:?approved classifier artifact directory is required}:/app/model-artifacts:ro
      - ${AI_EVALUATION_FILE:?approved evaluation file is required}:/app/evaluation/production.json:ro
      - ${AI_PROMOTION_ROOT:-./.runtime/promotion}:/app/promotion:ro
      - ${MEMORY_POLICY_FILE:-./docs/ai-rebuild/memory-policy-v1.json}:/app/policies/memory-policy-v1.json:ro
    mem_limit: ${AI_CLASSIFIER_MEMORY_LIMIT:?calibrated classifier memory limit is required}
    cpus: ${AI_CLASSIFIER_CPU_LIMIT:?calibrated classifier CPU limit is required}
    pids_limit: ${AI_CLASSIFIER_PID_LIMIT:?calibrated classifier PID limit is required}

  knowledge-service:
    <<: *common
    image: ${AI_KNOWLEDGE_IMAGE:?AI_KNOWLEDGE_IMAGE must be a versioned tag or digest}
    command: ["python", "-m", "uvicorn", "app.knowledge_runtime:from_environment", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    group_add: ["1001"]
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      audit-volume-init:
        condition: service_completed_successfully
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required}
      - AUTH_MODE=${AUTH_MODE:?AUTH_MODE is required}
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - AUDIT_DATABASE_PATH=/app/audit/audit.sqlite3
      - RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
      - AI_MANAGEMENT_ENABLED=false
      - RAG_RETRIEVAL_ENABLED=true
      - RAG_GENERATION_ENABLED=${RAG_GENERATION_ENABLED:-false}
      - RAG_RESPONSE_ENABLED=${RAG_RESPONSE_ENABLED:-false}
      - RAG_RESPONSE_PROMOTION_POINTER_PATH=/app/promotion/current.json
      - RAG_RESPONSE_CANDIDATE_ID=${RAG_RESPONSE_CANDIDATE_ID:-}
      - RAG_ALLOWED_TENANTS=${RAG_ALLOWED_TENANTS:?RAG_ALLOWED_TENANTS is required}
      - RAG_RESPONSE_ALLOWED_USERS=${RAG_RESPONSE_ALLOWED_USERS:-}
      - RAG_RETRIEVAL_STRATEGY=${RAG_RETRIEVAL_STRATEGY:-hybrid-bge-v1}
      - LLAMAINDEX_CANDIDATE_COLLECTION=${LLAMAINDEX_CANDIDATE_COLLECTION:-eisenhower-knowledge-llama-v1-candidate}
      - LLAMAINDEX_PIPELINE_VERSION=${LLAMAINDEX_PIPELINE_VERSION:-llama-sentence-256-32-v1}
      - LLAMAINDEX_CHUNK_SIZE=${LLAMAINDEX_CHUNK_SIZE:-256}
      - LLAMAINDEX_CHUNK_OVERLAP=${LLAMAINDEX_CHUNK_OVERLAP:-32}
      - LLAMAINDEX_CACHE_PATH=/app/runtime/llamaindex-ingestion-cache.json
      - CHUNKING_VERSION=${LLAMAINDEX_PIPELINE_VERSION:-llama-sentence-256-32-v1}
      - RAG_EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - RAG_EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - RAG_EMBEDDING_DEVICE=cpu
      - EMBEDDING_VERSION=bge-m3-v1
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-eisenhower-knowledge-active}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/eisenhower?replicaSet=rs0}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-eisenhower}
      - CANONICAL_DOCUMENTS_COLLECTION=${CANONICAL_DOCUMENTS_COLLECTION:-rag_documents}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-http://reranker:8000}
      - RERANKER_API_KEY=${RERANKER_API_KEY:?RERANKER_API_KEY is required}
      - RERANKER_ALLOWED_HOSTS=${RERANKER_ALLOWED_HOSTS:-reranker}
      - INFERENCE_BASE_URL=${INFERENCE_BASE_URL:-http://inference:8000/v1}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
      - INFERENCE_ALLOWED_HOSTS=${INFERENCE_ALLOWED_HOSTS:-inference}
      - PROMPT_VERSION=${PROMPT_VERSION:-1.2.0}
      - KNOWLEDGE_PROMPT_VERSION=${KNOWLEDGE_PROMPT_VERSION:-1.0.0}
      - OMP_NUM_THREADS=${AI_KNOWLEDGE_OMP_THREADS:?measured knowledge OMP thread limit is required}
      - MKL_NUM_THREADS=${AI_KNOWLEDGE_OMP_THREADS:?measured knowledge OMP thread limit is required}
      - OPENBLAS_NUM_THREADS=${AI_KNOWLEDGE_OMP_THREADS:?measured knowledge OMP thread limit is required}
      - NUMEXPR_NUM_THREADS=${AI_KNOWLEDGE_OMP_THREADS:?measured knowledge OMP thread limit is required}
      - TORCH_NUM_THREADS=${AI_KNOWLEDGE_TORCH_THREADS:?measured knowledge Torch thread limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - model_cache:/home/app/.cache/huggingface
      - knowledge_runtime:/app/runtime
      - audit_data:/app/audit
      - ${AI_PROMOTION_ROOT:-./.runtime/promotion}:/app/promotion:ro
    mem_limit: ${AI_KNOWLEDGE_MEMORY_LIMIT:?calibrated knowledge memory limit is required}
    cpus: ${AI_KNOWLEDGE_CPU_LIMIT:?calibrated knowledge CPU limit is required}
    pids_limit: ${AI_KNOWLEDGE_PID_LIMIT:?calibrated knowledge PID limit is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 5

  rag-worker:
    <<: *common
    image: ${AI_INGEST_IMAGE:?AI_INGEST_IMAGE must be a versioned tag or digest}
    group_add: ["1001"]
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      audit-volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker_runtime"]
    init: true
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required}
      - AUTH_MODE=${AUTH_MODE:?AUTH_MODE is required}
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/eisenhower?replicaSet=rs0}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-eisenhower}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-eisenhower-knowledge-active}
      - RAG_RETRIEVAL_ENABLED=true
      - RAG_GENERATION_ENABLED=false
      - RAG_RESPONSE_ENABLED=false
      - RAG_RETRIEVAL_STRATEGY=dense-v1
      - LLAMAINDEX_CANDIDATE_COLLECTION=${LLAMAINDEX_CANDIDATE_COLLECTION:-eisenhower-knowledge-llama-v1-candidate}
      - LLAMAINDEX_PIPELINE_VERSION=${LLAMAINDEX_PIPELINE_VERSION:-llama-sentence-256-32-v1}
      - LLAMAINDEX_CHUNK_SIZE=${LLAMAINDEX_CHUNK_SIZE:-256}
      - LLAMAINDEX_CHUNK_OVERLAP=${LLAMAINDEX_CHUNK_OVERLAP:-32}
      - LLAMAINDEX_CACHE_PATH=/app/runtime/llamaindex-ingestion-cache.json
      - CHUNKING_VERSION=${LLAMAINDEX_PIPELINE_VERSION:-llama-sentence-256-32-v1}
      - RAG_EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - RAG_EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - RAG_EMBEDDING_DEVICE=cpu
      - EMBEDDING_VERSION=bge-m3-v1
      - LOCAL_MODEL_ARTIFACT_DIR=/app/model-artifacts
      - LOCAL_MODEL_APPROVED_ARTIFACT_SHA256=${LOCAL_MODEL_APPROVED_ARTIFACT_SHA256:?approved classifier pointer digest is required}
      - LOCAL_MODEL_REQUIRE_EVALUATION=true
      - LOCAL_MODEL_EVALUATION_PROFILE=production
      - LOCAL_MODEL_APPROVED_EVALUATION_SHA256=${LOCAL_MODEL_APPROVED_EVALUATION_SHA256:?approved evaluation digest is required}
      - EVALUATION_DATA_PATH=/app/evaluation/production.json
      - MODEL_CACHE_DIR=/app/runtime
      - NUMBA_CACHE_DIR=/app/runtime/numba
      - MPLCONFIGDIR=/app/runtime/matplotlib
      - XDG_CACHE_HOME=/app/runtime/cache
      - DOCLING_ARTIFACTS_PATH=/app/docling-artifacts
      - DOCLING_ARTIFACTS_MANIFEST_SHA256=${DOCLING_ARTIFACTS_MANIFEST_SHA256:?approved Docling artifact manifest digest is required}
      - JOBS_DATABASE_PATH=/app/data/jobs.sqlite3
      - JOBS_MAX_QUEUED=${JOBS_MAX_QUEUED:?measured bounded queue capacity is required}
      - EISENHOWER_WEBHOOK_SECRET=${EISENHOWER_WEBHOOK_SECRET:?EISENHOWER_WEBHOOK_SECRET is required}
      - CORPUS_REPOSITORY_ROOT=/corpus
      - CORPUS_MANIFEST_PATH=/corpus/docs/ai-rebuild/corpus-manifest-v1.json
      - CORPUS_OWNER_ID=${CORPUS_OWNER_ID:-eisenhower-owner}
      - CORPUS_ALLOWED_PROJECTS=${CORPUS_ALLOWED_PROJECTS:-eisenhower}
      - OMP_NUM_THREADS=${AI_INGEST_OMP_THREADS:?measured ingest OMP thread limit is required}
      - MKL_NUM_THREADS=${AI_INGEST_OMP_THREADS:?measured ingest OMP thread limit is required}
      - OPENBLAS_NUM_THREADS=${AI_INGEST_OMP_THREADS:?measured ingest OMP thread limit is required}
      - NUMEXPR_NUM_THREADS=${AI_INGEST_OMP_THREADS:?measured ingest OMP thread limit is required}
      - TORCH_NUM_THREADS=${AI_INGEST_TORCH_THREADS:?measured ingest Torch thread limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - rag_jobs:/app/data
      - model_cache:/home/app/.cache/huggingface
      - ingest_runtime:/app/runtime
      - ${AI_DOCLING_ARTIFACT_ROOT:?approved Docling artifact directory is required}:/app/docling-artifacts:ro
      - ${AI_CLASSIFIER_ARTIFACT_ROOT:?approved classifier artifact directory is required}:/app/model-artifacts:ro
      - ${AI_EVALUATION_FILE:?approved evaluation file is required}:/app/evaluation/production.json:ro
      - ./README.md:/corpus/README.md:ro
      - ./docs:/corpus/docs:ro
      - ./corpus:/corpus/corpus:ro
      - ./.tasks:/corpus/.tasks:ro
    mem_limit: ${AI_INGEST_MEMORY_LIMIT:?calibrated ingest memory limit is required}
    cpus: ${AI_INGEST_CPU_LIMIT:?calibrated ingest CPU limit is required}
    pids_limit: ${AI_INGEST_PID_LIMIT:?calibrated ingest PID limit is required}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from app.config import load_settings; from app.jobs import SqliteJobQueue;
          age = SqliteJobQueue(load_settings().jobs_database_path).latest_worker_heartbeat_age_seconds();
          raise SystemExit(0 if age is not None and age < 60 else 1)
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 5

  qdrant:
    <<: *common
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.0}
    environment:
      - QDRANT__LOG_LEVEL=info
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    <<: *common
    image: ${N8N_IMAGE:-n8nio/n8n:2.4.6}
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PATH=/admin/n8n/
      - N8N_EDITOR_BASE_URL=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}/admin/n8n/
      - N8N_PROXY_HOPS=1
      - N8N_RAG_HEADER_AUTH_CREDENTIAL_ID=${N8N_RAG_HEADER_AUTH_CREDENTIAL_ID:-}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EISENHOWER_INTERNAL_API_URL=${EISENHOWER_INTERNAL_API_URL:-http://api-service:3001}
      - EISENHOWER_INTERNAL_API_TOKEN=${EISENHOWER_INTERNAL_API_TOKEN:?EISENHOWER_INTERNAL_API_TOKEN is required}
      - EISENHOWER_NODE_INTERNAL_API_URL=${EISENHOWER_NODE_INTERNAL_API_URL:-http://api-service:3001}
      - EISENHOWER_KNOWLEDGE_INTERNAL_API_URL=${EISENHOWER_KNOWLEDGE_INTERNAL_API_URL:-http://knowledge-service:8000}
      - CALENDAR_INTERNAL_HMAC_KEY=${CALENDAR_INTERNAL_HMAC_KEY:?CALENDAR_INTERNAL_HMAC_KEY is required}
      - GOOGLE_CALENDAR_WEBHOOK_URL=${GOOGLE_CALENDAR_WEBHOOK_URL:?GOOGLE_CALENDAR_WEBHOOK_URL is required}
      # Repository-owned Code nodes need these scoped values for HMAC-signed calls.
      # Keep this n8n instance loopback/private and operator-only.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n:/repo-n8n:ro
    tmpfs:
      - /reconcile:mode=0700,uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  prometheus:
    <<: *common
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.external-url=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}/admin/prometheus/
      - --web.route-prefix=/admin/prometheus/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/admin/prometheus/-/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SERVER_ROOT_URL=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}/admin/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Admin
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/admin/grafana/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  identity-db:
    <<: *common
    image: ${IDENTITY_DB_IMAGE:-postgres:17.6-alpine}
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${IDENTITY_DB_USERNAME:?IDENTITY_DB_USERNAME is required}
      - POSTGRES_PASSWORD=${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    <<: *common
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    command: ["start", "--import-realm"]
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://identity-db:5432/keycloak
      - KC_DB_USERNAME=${IDENTITY_DB_USERNAME:?IDENTITY_DB_USERNAME is required}
      - KC_DB_PASSWORD=${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME is required}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      - KC_HOSTNAME=${OIDC_PUBLIC_ORIGIN:?OIDC_PUBLIC_ORIGIN is required}
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/identity
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - JAVA_OPTS_KC_HEAP=-XX:MaxRAMPercentage=65
      - EISENHOWER_OIDC_REDIRECT_URI=${EISENHOWER_OIDC_REDIRECT_URI:?EISENHOWER_OIDC_REDIRECT_URI is required}
      - EISENHOWER_OIDC_WEB_ORIGIN=${EISENHOWER_OIDC_WEB_ORIGIN:?EISENHOWER_OIDC_WEB_ORIGIN is required}
      - EISENHOWER_OIDC_POST_LOGOUT_REDIRECT_URI=${EISENHOWER_OIDC_POST_LOGOUT_REDIRECT_URI:?EISENHOWER_OIDC_POST_LOGOUT_REDIRECT_URI is required}
      - EISENHOWER_MCP_REDIRECT_URI=${EISENHOWER_MCP_REDIRECT_URI:?EISENHOWER_MCP_REDIRECT_URI is required}
      - EISENHOWER_MCP_CLIENT_SECRET=${EISENHOWER_MCP_CLIENT_SECRET:?EISENHOWER_MCP_CLIENT_SECRET is required}
      - OIDC_MCP_RESOURCE_URL=${OIDC_MCP_RESOURCE_URL:?OIDC_MCP_RESOURCE_URL is required}
      - ADMIN_OIDC_CLIENT_SECRET=${ADMIN_OIDC_CLIENT_SECRET:?ADMIN_OIDC_CLIENT_SECRET is required}
      - ADMIN_OIDC_REDIRECT_URI=${ADMIN_OIDC_REDIRECT_URI:?ADMIN_OIDC_REDIRECT_URI is required}
    volumes:
      - ./deploy/local/identity/eisenhower-realm.json:/opt/keycloak/data/import/eisenhower-realm.json:ro
      - ./deploy/local/identity/eisenhower-user-profile.json:/opt/keycloak/conf/eisenhower-user-profile.json:ro

  identity-admin-bootstrap:
    <<: *common
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    restart: "no"
    read_only: true
    entrypoint: ["/bin/sh", "/opt/eisenhower/ensure-admin-access.sh"]
    depends_on:
      identity-service:
        condition: service_started
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME is required}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      - ADMIN_OIDC_CLIENT_SECRET=${ADMIN_OIDC_CLIENT_SECRET:?ADMIN_OIDC_CLIENT_SECRET is required}
      - ADMIN_OIDC_REDIRECT_URI=${ADMIN_OIDC_REDIRECT_URI:?ADMIN_OIDC_REDIRECT_URI is required}
      - IDENTITY_ADMIN_URL=http://identity-service:8080/identity
    volumes:
      - ./deploy/local/identity/ensure-admin-access.sh:/opt/eisenhower/ensure-admin-access.sh:ro
      - ./deploy/local/identity/eisenhower-admin-claims.json:/opt/eisenhower/eisenhower-admin-claims.json:ro
      - ./deploy/local/identity/admin-claim-mappers:/opt/eisenhower/admin-claim-mappers:ro
    tmpfs:
      - /opt/keycloak/.keycloak:mode=0700,uid=1000,gid=0

  mcp-service:
    <<: *common
    image: ${MCP_IMAGE:?MCP_IMAGE must be a versioned tag or digest}
    depends_on:
      api-service:
        condition: service_started
      ai-service:
        condition: service_started
      identity-service:
        condition: service_started
      audit-volume-init:
        condition: service_completed_successfully
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_HTTP_PATH=/mcp
      - MCP_BEHIND_TRUSTED_PROXY=true
      - MCP_OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - MCP_OIDC_AUDIENCE=${OIDC_MCP_RESOURCE_URL:?OIDC_MCP_RESOURCE_URL is required}
      - MCP_OIDC_JWKS_URL=${OIDC_JWKS_URL:?OIDC_JWKS_URL is required}
      - MCP_RESOURCE_SERVER_URL=${OIDC_MCP_RESOURCE_URL:?OIDC_MCP_RESOURCE_URL is required}
      - MCP_OIDC_TOKEN_ENDPOINT=${OIDC_ISSUER:?OIDC_ISSUER is required}/protocol/openid-connect/token
      - MCP_OIDC_CLIENT_ID=eisenhower-mcp-exchange
      - MCP_OIDC_CLIENT_SECRET=${EISENHOWER_MCP_CLIENT_SECRET:?EISENHOWER_MCP_CLIENT_SECRET is required}
      - EISENHOWER_API_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - EISENHOWER_TASK_API_BASE_URL=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}/api
      - EISENHOWER_AI_API_BASE_URL=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}/ai
      - EISENHOWER_API_TIMEOUT_SECONDS=5
      - EISENHOWER_AUDIT_DB_PATH=/app/audit/mcp-audit.sqlite3
      - EISENHOWER_AUDIT_HMAC_KEY_FILE=/run/eisenhower/audit.key
      - EISENHOWER_AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      - EISENHOWER_RELEASE_SHA=${RELEASE_SHA:?RELEASE_SHA is required}
    volumes:
      - audit_data:/app/audit
    tmpfs:
      - /run/eisenhower:mode=0700,uid=1001,gid=1001

  oauth2-proxy:
    <<: *common
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.12.0-alpine}
    depends_on:
      identity-admin-bootstrap:
        condition: service_completed_successfully
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - --skip-oidc-discovery=true
      - --login-url=${OIDC_ISSUER:?OIDC_ISSUER is required}/protocol/openid-connect/auth
      - --redeem-url=http://identity-service:8080/identity/realms/eisenhower/protocol/openid-connect/token
      - --profile-url=http://identity-service:8080/identity/realms/eisenhower/protocol/openid-connect/userinfo
      - --oidc-jwks-url=http://identity-service:8080/identity/realms/eisenhower/protocol/openid-connect/certs
      - --client-id=eisenhower-admin-access
      - --client-secret=${ADMIN_OIDC_CLIENT_SECRET:?ADMIN_OIDC_CLIENT_SECRET is required}
      - --redirect-url=${ADMIN_OIDC_REDIRECT_URI:?ADMIN_OIDC_REDIRECT_URI is required}
      - --cookie-secret=${ADMIN_OIDC_COOKIE_SECRET:?ADMIN_OIDC_COOKIE_SECRET is required}
      - --cookie-name=_eisenhower_admin
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=15m
      - --cookie-refresh=1m
      - --email-domain=*
      - --scope=openid
      - --allowed-role=eisenhower-admin
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4180/ping >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  gateway:
    <<: *common
    image: ${ACCESS_GATEWAY_IMAGE:-nginx:1.27.5-alpine}
    depends_on:
      web:
        condition: service_healthy
      identity-service:
        condition: service_started
      identity-admin-bootstrap:
        condition: service_completed_successfully
      mcp-service:
        condition: service_started
      n8n:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      oauth2-proxy:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8790}:8080"
    environment:
      - ACCESS_GATEWAY_HOST=${ACCESS_GATEWAY_HOST:?ACCESS_GATEWAY_HOST is required}
      - ACCESS_GATEWAY_ALLOWED_ORIGIN=${ACCESS_GATEWAY_ALLOWED_ORIGIN:?ACCESS_GATEWAY_ALLOWED_ORIGIN is required}
      - ACCESS_ADMIN_ALLOWED_ORIGIN=${ACCESS_PUBLIC_ORIGIN:?ACCESS_PUBLIC_ORIGIN is required}
      - IDENTITY_UPSTREAM=${ACCESS_GATEWAY_IDENTITY_UPSTREAM:-identity-service:8080}
      - MCP_UPSTREAM=${ACCESS_GATEWAY_MCP_UPSTREAM:-mcp-service:8000}
      - API_UPSTREAM=${ACCESS_GATEWAY_API_UPSTREAM:-api-service:3001}
      - AI_UPSTREAM=${ACCESS_GATEWAY_AI_UPSTREAM:-ai-service:8000}
      - KNOWLEDGE_UPSTREAM=${ACCESS_GATEWAY_KNOWLEDGE_UPSTREAM:-knowledge-service:8000}
      - WEB_UPSTREAM=${ACCESS_GATEWAY_WEB_UPSTREAM:-web:3000}
      - N8N_UPSTREAM=${CALENDAR_GATEWAY_N8N_UPSTREAM:-n8n:5678}
      - PROMETHEUS_UPSTREAM=${ACCESS_GATEWAY_PROMETHEUS_UPSTREAM:-prometheus:9090}
      - GRAFANA_UPSTREAM=${ACCESS_GATEWAY_GRAFANA_UPSTREAM:-grafana:3000}
      - ADMIN_AUTH_UPSTREAM=${ACCESS_GATEWAY_ADMIN_AUTH_UPSTREAM:-oauth2-proxy:4180}
    volumes:
      - ./deploy/local/access-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  mongodb_data:
  qdrant_data:
  n8n_data:
  prometheus_data:
  grafana_data:
  rag_jobs:
  model_cache:
  classifier_runtime:
  knowledge_runtime:
  ingest_runtime:
  audit_data:
  identity_db_data:

networks:
  private:
    name: ${COMPOSE_PRIVATE_NETWORK:-eisenhower-private}
