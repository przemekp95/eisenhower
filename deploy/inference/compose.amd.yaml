name: eisenhower-inference-amd

x-amd: &amd
  restart: unless-stopped
  networks: [application]
  ipc: host
  group_add: [video]
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  cap_add: [SYS_PTRACE]
  security_opt: [seccomp=unconfined]

services:
  inference:
    <<: *amd
    image: ${AMD_RESPONSE_IMAGE:?immutable AMD response image digest is required}
    profiles: [inference-amd]
    expose: ["8000"]
    environment:
      - VLLM_API_KEY=${INFERENCE_API_KEY:?INFERENCE_API_KEY is required}
      - OMP_NUM_THREADS=${INFERENCE_OMP_THREADS:?measured inference OMP limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is provider configuration}
      - --revision
      - ${INFERENCE_MODEL_REVISION:?INFERENCE_MODEL_REVISION is required}
      - --served-model-name
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is provider configuration}
      - --api-key
      - ${INFERENCE_API_KEY:?INFERENCE_API_KEY is required}
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${INFERENCE_GPU_MEMORY_UTILIZATION:-0.80}
      - --disable-log-requests
    mem_limit: ${INFERENCE_MEMORY_LIMIT:?calibrated inference memory limit is required}
    cpus: ${INFERENCE_CPU_LIMIT:?calibrated inference CPU limit is required}
    pids_limit: ${INFERENCE_PID_LIMIT:?calibrated inference PID limit is required}

  reranker:
    <<: *amd
    image: ${AMD_RESPONSE_IMAGE:?immutable AMD response image digest is required}
    profiles: [inference-amd]
    expose: ["8000"]
    environment:
      - VLLM_API_KEY=${RERANKER_API_KEY:?RERANKER_API_KEY is required}
      - OMP_NUM_THREADS=${RERANKER_OMP_THREADS:?measured reranker OMP limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model
      - BAAI/bge-reranker-v2-m3
      - --revision
      - 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --served-model-name
      - BAAI/bge-reranker-v2-m3@953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --runner
      - pooling
      - --max-model-len
      - "192"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.10"
      - --no-enable-log-requests
    mem_limit: ${RERANKER_MEMORY_LIMIT:?calibrated reranker memory limit is required}
    cpus: ${RERANKER_CPU_LIMIT:?calibrated reranker CPU limit is required}
    pids_limit: ${RERANKER_PID_LIMIT:?calibrated reranker PID limit is required}

networks:
  application:
    external: true
    name: ${INFERENCE_NETWORK_NAME:-eisenhower-private}
