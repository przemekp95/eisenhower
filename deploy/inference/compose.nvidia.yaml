name: eisenhower

services:
  inference:
    image: vllm/vllm-openai:v0.20.0
    expose:
      - "8000"
    command:
      - --model
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is required}
      - --api-key
      - ${INFERENCE_API_KEY:?INFERENCE_API_KEY is required}
      - --disable-log-requests
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    profiles:
      - inference-nvidia
