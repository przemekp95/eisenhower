name: eisenhower-local-production

services:
  ai-service:
    image: ${AI_ROCM_IMAGE:?AI_ROCM_IMAGE must be an immutable local tag or digest}
    profiles:
      - retrieval-amd
    environment:
      - RELEASE_SHA=${AI_ROCM_RELEASE_SHA:?AI_ROCM_RELEASE_SHA must match the immutable image source SHA}
      - RAG_RETRIEVAL_ENABLED=true
      - RAG_GENERATION_ENABLED=false
      - RAG_RESPONSE_ENABLED=false
      - RAG_EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - RAG_EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - RAG_EMBEDDING_DEVICE=cuda
      - EMBEDDING_VERSION=bge-m3-v1
    ipc: host
    group_add:
      - video
      - render
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined

  rag-worker:
    image: ${AI_ROCM_IMAGE:?AI_ROCM_IMAGE must be an immutable local tag or digest}
    profiles:
      - retrieval-amd
    environment:
      - RELEASE_SHA=${AI_ROCM_RELEASE_SHA:?AI_ROCM_RELEASE_SHA must match the immutable image source SHA}
      - RAG_RETRIEVAL_ENABLED=true
      - RAG_GENERATION_ENABLED=false
      - RAG_RESPONSE_ENABLED=false
      - RAG_EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - RAG_EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - RAG_EMBEDDING_DEVICE=cuda
      - EMBEDDING_VERSION=bge-m3-v1
    ipc: host
    group_add:
      - video
      - render
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined

  # Contract-only until the physical ROCm/model qualification gate passes.
  # Binding defaults to loopback; use only an actual private VPN/LAN address
  # when FastAPI is placed on a different host.
  inference:
    image: ${AMD_INFERENCE_IMAGE:-vllm/vllm-openai-rocm:v0.20.0}
    profiles:
      - inference-amd
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_BIND_PORT:-8010}:8000"
    command:
      - --model
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is required}
      - --api-key
      - ${INFERENCE_API_KEY:?INFERENCE_API_KEY is required}
      - --disable-log-requests
    ipc: host
    group_add:
      - video
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    networks:
      - private

networks:
  private:
    name: ${COMPOSE_PRIVATE_NETWORK:-eisenhower-local-private}
