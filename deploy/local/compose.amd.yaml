name: eisenhower-local-production

services:
  knowledge-service:
    image: ${AI_KNOWLEDGE_ROCM_IMAGE:?AI_KNOWLEDGE_ROCM_IMAGE must be an immutable local tag or digest}
    profiles:
      - retrieval-amd
      - response-amd
    environment:
      - RELEASE_SHA=${AI_ROCM_RELEASE_SHA:?AI_ROCM_RELEASE_SHA must match the immutable image source SHA}
      - RAG_EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - RAG_EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - RAG_EMBEDDING_DEVICE=cuda
      - EMBEDDING_VERSION=bge-m3-v1
    ipc: host
    group_add:
      - video
      - "110"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined

  # Binding defaults to loopback; use only an actual private VPN/LAN address
  # when FastAPI is placed on a different host.
  inference:
    image: ${AMD_INFERENCE_IMAGE:-vllm/vllm-openai-rocm@sha256:3be0d8f3ec3ebcc99203e08d895392a8d749ed8a132f41574a8018cdaf525a22}
    profiles:
      - inference-amd
    ports:
      - "${INFERENCE_BIND_ADDRESS:-127.0.0.1}:${INFERENCE_BIND_PORT:-8010}:8000"
    environment:
      - VLLM_API_KEY=${INFERENCE_API_KEY:?INFERENCE_API_KEY is required}
      - OMP_NUM_THREADS=${INFERENCE_OMP_THREADS:?measured inference OMP thread limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is required}
      - --revision
      - ${INFERENCE_MODEL_REVISION:?INFERENCE_MODEL_REVISION is required}
      - --tokenizer
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is required}
      - --tokenizer-revision
      - ${INFERENCE_MODEL_REVISION:?INFERENCE_MODEL_REVISION is required}
      - --served-model-name
      - ${INFERENCE_MODEL:?INFERENCE_MODEL is required}
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${INFERENCE_GPU_MEMORY_UTILIZATION:-0.80}
    ipc: host
    group_add:
      - video
      - "110"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Authorization: Bearer $$VLLM_API_KEY"
          http://127.0.0.1:8000/v1/models >/dev/null
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    restart: unless-stopped
    networks:
      - private
    mem_limit: ${INFERENCE_MEMORY_LIMIT:?calibrated inference memory limit is required}
    cpus: ${INFERENCE_CPU_LIMIT:?calibrated inference CPU limit is required}
    pids_limit: ${INFERENCE_PID_LIMIT:?calibrated inference PID limit is required}

  reranker:
    image: ${AMD_RERANKER_IMAGE:-vllm/vllm-openai-rocm@sha256:3be0d8f3ec3ebcc99203e08d895392a8d749ed8a132f41574a8018cdaf525a22}
    profiles:
      - reranker-amd
    ports:
      - "${RERANKER_BIND_ADDRESS:-127.0.0.1}:${RERANKER_BIND_PORT:-8011}:8000"
    environment:
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - VLLM_API_KEY=${RERANKER_API_KEY:?RERANKER_API_KEY is required}
      - OMP_NUM_THREADS=${RERANKER_OMP_THREADS:?measured reranker OMP thread limit is required}
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model
      - BAAI/bge-reranker-v2-m3
      - --revision
      - 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --served-model-name
      - BAAI/bge-reranker-v2-m3@953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --runner
      - pooling
      - --max-model-len
      - "192"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.10"
      - --no-enable-log-requests
    ipc: host
    group_add:
      - video
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${RERANKER_MODEL_CACHE:-../../.runtime-cache/reranker-huggingface}:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Authorization: Bearer $$VLLM_API_KEY"
          http://127.0.0.1:8000/v1/models >/dev/null
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    restart: unless-stopped
    networks:
      - private
    mem_limit: ${RERANKER_MEMORY_LIMIT:?calibrated reranker memory limit is required}
    cpus: ${RERANKER_CPU_LIMIT:?calibrated reranker CPU limit is required}
    pids_limit: ${RERANKER_PID_LIMIT:?calibrated reranker PID limit is required}

networks:
  private:
    name: ${COMPOSE_PRIVATE_NETWORK:-eisenhower-local-private}
