groups:
  - name: eisenhower-supported-runtime
    rules:
      - alert: EisenhowerAIServiceDown
        expr: up{job="eisenhower-ai"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI service is unavailable"
      - alert: EisenhowerKnowledgeServiceDown
        expr: eisenhower_ai_boundary_upstream_live == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Private knowledge service is unavailable from the Mikrus boundary"
