name: eisenhower

services:
  mongodb:
    image: mongo:7-jammy@sha256:04582c3a144d088f841c446abfc19f79adcefa8bd00ad4a7fb18e27b9585c5d6
    restart: unless-stopped
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - ${MONGODB_CACHE_SIZE_GB:-0.25}
    mem_limit: ${MONGODB_MEMORY_LIMIT:-1g}
    cpus: ${MONGODB_CPUS:-1.0}
    pids_limit: 512
    environment:
      MONGO_INITDB_DATABASE: eisenhower
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 10s
      retries: 5

  ai-service:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-ai-boundary:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.api_boundary:from_environment", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      APP_ENV: production
      AUTH_MODE: static
      EISENHOWER_API_TOKEN: ${EISENHOWER_API_TOKEN:?EISENHOWER_API_TOKEN is required}
      EISENHOWER_ADMIN_TOKEN: ${EISENHOWER_ADMIN_TOKEN:?EISENHOWER_ADMIN_TOKEN is required}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      AUDIT_DATABASE_PATH: /app/audit/ai-boundary.sqlite3
      CLASSIFIER_SERVICE_URL: ${CLASSIFIER_SERVICE_URL:-${KNOWLEDGE_SERVICE_BASE_URL:?private classifier service URL is required}}
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-${KNOWLEDGE_SERVICE_BASE_URL:?private knowledge service URL is required}}
      AI_ROLE_ALLOWED_HOSTS: ${AI_ROLE_ALLOWED_HOSTS:-${KNOWLEDGE_SERVICE_ALLOWED_HOSTS:?private AI role hosts are required}}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS is required}
      RELEASE_SHA: ${IMAGE_TAG:?IMAGE_TAG is required}
    volumes:
      - audit_data:/app/audit
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-service:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The existing Mikrus topology is intentionally single-tenant. Do not
      # infer OIDC or multi-user isolation from this deployment profile.
      AUTH_MODE: static
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/eisenhower
      AI_SERVICE_URL: http://ai-service:8000
      EISENHOWER_API_TOKEN: ${EISENHOWER_API_TOKEN:?EISENHOWER_API_TOKEN is required}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      AUDIT_LOG_PATH: /app/audit/node-audit.ndjson
      RELEASE_SHA: ${IMAGE_TAG:?IMAGE_TAG is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS is required}
    volumes:
      - audit_data:/app/audit
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_AI_API_URL: ${VITE_AI_API_URL:-/ai}
    depends_on:
      api-service:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:
  audit_data:
  prometheus_data:
