name: eisenhower

services:
  mongodb:
    image: mongo:7-jammy@sha256:04582c3a144d088f841c446abfc19f79adcefa8bd00ad4a7fb18e27b9585c5d6
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: eisenhower
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 10s
      retries: 5

  ai-service:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-ai:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      APP_ENV: production
      EISENHOWER_API_TOKEN: ${EISENHOWER_API_TOKEN:?EISENHOWER_API_TOKEN is required}
      EISENHOWER_ADMIN_TOKEN: ${EISENHOWER_ADMIN_TOKEN:?EISENHOWER_ADMIN_TOKEN is required}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      AUDIT_DATABASE_PATH: /app/audit/audit.sqlite3
      RELEASE_SHA: ${IMAGE_TAG:?IMAGE_TAG is required}
      TRAINING_DATA_PATH: /app/data/training_data.json
      MODEL_CACHE_DIR: /app/data/runtime
      EVALUATION_DATA_PATH: /app/evaluation/production.json
      LOCAL_MODEL_REQUIRE_EVALUATION: "true"
      LOCAL_MODEL_EVALUATION_PROFILE: production
      LOCAL_MODEL_APPROVED_EVALUATION_SHA256: ${LOCAL_MODEL_APPROVED_EVALUATION_SHA256:?approved production evaluation digest is required}
      AI_MANAGEMENT_ENABLED: "false"
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      LOCAL_MODEL_REVISION: ${LOCAL_MODEL_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
      LOCAL_MODEL_EPOCHS: ${LOCAL_MODEL_EPOCHS:-60}
      LOCAL_MODEL_PATIENCE: ${LOCAL_MODEL_PATIENCE:-8}
      LOCAL_MODEL_HIDDEN_DIM: ${LOCAL_MODEL_HIDDEN_DIM:-128}
      LOCAL_MODEL_DROPOUT: ${LOCAL_MODEL_DROPOUT:-0.1}
      LOCAL_MODEL_LEARNING_RATE: ${LOCAL_MODEL_LEARNING_RATE:-0.01}
      TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-eng+pol}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS is required}
    volumes:
      - ai_data:/app/data
      - audit_data:/app/audit
      - ${AI_EVALUATION_FILE:?approved production evaluation file is required}:/app/evaluation/production.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-service:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The existing Mikrus topology is intentionally single-tenant. Do not
      # infer OIDC or multi-user isolation from this deployment profile.
      AUTH_MODE: static
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/eisenhower
      AI_SERVICE_URL: http://ai-service:8000
      EISENHOWER_API_TOKEN: ${EISENHOWER_API_TOKEN:?EISENHOWER_API_TOKEN is required}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      AUDIT_LOG_PATH: /app/audit/node-audit.ndjson
      RELEASE_SHA: ${IMAGE_TAG:?IMAGE_TAG is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS is required}
    volumes:
      - audit_data:/app/audit
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME is required}/eisenhower-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_AI_API_URL: ${VITE_AI_API_URL:-/ai}
    depends_on:
      api-service:
        condition: service_started
      ai-service:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      ai-service:
        condition: service_healthy
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:
  ai_data:
  audit_data:
  prometheus_data:
