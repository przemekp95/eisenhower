groups:
  - name: eisenhower-rag
    rules:
      - alert: EisenhowerAIServiceDown
        expr: up{job="eisenhower-ai"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI service is unavailable"
      - alert: EisenhowerRagFallbackRateHigh
        expr: sum(rate(eisenhower_rag_results_total{mode="fallback"}[10m])) / clamp_min(sum(rate(eisenhower_rag_results_total[10m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG fallback rate exceeds 25 percent"
      - alert: EisenhowerRagDeadLetters
        expr: eisenhower_job_queue_depth{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG ingestion dead-letter queue is not empty"
      - alert: EisenhowerRagStructuredOutputRejected
        expr: increase(eisenhower_rag_validation_total{outcome="rejected"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Private generation failed schema or citation validation"
      - alert: EisenhowerRagRetrievalLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(eisenhower_rag_retrieval_duration_seconds_bucket[10m]))) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG retrieval p95 exceeds 500 milliseconds"
      - alert: EisenhowerMemoryOperationErrors
        expr: increase(eisenhower_memory_operations_total{outcome="error"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Consent-governed memory operation failed"
      - alert: EisenhowerAuditWriteFailed
        expr: increase(eisenhower_audit_events_total{outcome="error"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A required durable audit write failed; sensitive operations fail closed"
      - alert: QdrantUnavailable
        expr: up{job="qdrant"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant is unavailable"
      - alert: PrivateInferenceUnavailable
        expr: >-
          (absent(up{job="inference"}) or up{job="inference"} == 0)
          and on() eisenhower_generation_circuit_state{state!="disabled"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Private inference is unavailable; classifier fallback should be active"
      - alert: EisenhowerRagWorkerStale
        expr: >-
          (absent(eisenhower_job_worker_heartbeat_age_seconds)
          or eisenhower_job_worker_heartbeat_age_seconds > 90)
          and on() eisenhower_job_queue_enabled == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG worker heartbeat is missing or stale"
